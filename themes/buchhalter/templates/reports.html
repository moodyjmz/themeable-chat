<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pfennigfuchs — Berichte</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/theme.css">
<style>
  body { padding: 48px 24px; }
  .lang-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    background: var(--surface-card);
    border: var(--border-subtle);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-toggle:hover {
    color: var(--accent-light);
    border-color: var(--accent-hover);
  }
</style>
</head>
<body>
<button class="lang-toggle" id="langToggle">EN</button>

<div class="container">

  <div class="header">
    <div class="portrait-frame">📊</div>
    <div class="name" style="font-size:1.8rem" data-i18n="title">Berichte</div>
    <div class="subtitle" data-i18n="subtitle">XLSX-Export nach Steuerjahr</div>
  </div>

  <div class="section">
    <table>
      <tr>
        <th data-i18n="thYear">Jahr</th>
        <th data-i18n="thIncome">Einnahmen</th>
        <th data-i18n="thExpenses">Ausgaben</th>
        <th data-i18n="thTransactions">Transaktionen</th>
        <th></th>
      </tr>
      {{yearRows}}
    </table>
  </div>

  <div style="text-align:center;margin-top:32px">
    <a href="/" class="btn btn-ghost" data-i18n="backToChat">← Zurück zu Pfennigfuchs</a>
    &nbsp;
    <a href="/dashboard" class="btn btn-ghost" data-i18n="dashboardLink">Übersicht</a>
  </div>

</div>

<script>
const I18N = {
  de: {
    title: 'Berichte',
    subtitle: 'XLSX-Export nach Steuerjahr',
    thYear: 'Jahr', thIncome: 'Einnahmen', thExpenses: 'Ausgaben', thTransactions: 'Transaktionen',
    backToChat: '\u2190 Zurück zu Pfennigfuchs', dashboardLink: 'Übersicht',
    langToggle: 'EN'
  },
  en: {
    title: 'Reports',
    subtitle: 'XLSX export by tax year',
    thYear: 'Year', thIncome: 'Income', thExpenses: 'Expenses', thTransactions: 'Transactions',
    backToChat: '\u2190 Back to Pfennigfuchs', dashboardLink: 'Overview',
    langToggle: 'DE'
  }
};

let currentLang = localStorage.getItem('buchhalter-lang') || 'de';

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('buchhalter-lang', lang);
  document.documentElement.lang = lang;
  const strings = I18N[lang];
  if (!strings) return;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (strings[key]) el.textContent = strings[key];
  });
  document.getElementById('langToggle').textContent = strings.langToggle;
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLang(currentLang === 'de' ? 'en' : 'de');
});

applyLang(currentLang);
</script>
</body>
</html>
